<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="64" height="64"
     viewBox="0 0 64 64"
     aria-label="ソラのこえ favicon">

  <!-- 背景 -->
  <rect width="64" height="64" fill="#ffffff"/>

  <!-- 月：大（受信・鏡） -->
  <circle cx="32" cy="32" r="14"
          fill="#111" opacity="0.6"/>

  <!-- 月：大 内側（右にずらす） -->
  <circle cx="35.2" cy="32" r="12.2"
          fill="#ffffff"/>

  <!-- 月：小（余韻） -->
  <circle cx="38.5" cy="32" r="6.2"
          fill="#111" opacity="0.45"/>

  <!-- 月：小 内側 -->
  <circle cx="36.9" cy="32" r="5.4"
          fill="#ffffff"/>

</svg>
